<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#27a9cf">
<title>꼬미의 무인도 30일</title>
<style>
:root{
  --ink:#3b2810;--ink2:#8a6a42;--cream:#fff8ec;--paper:#fffdf8;--line:#efdcb8;--shadow:#e3c99b;
  --accent:#ff8a3d;--accent2:#ff6a2b;--good:#2fae66;--bad:#ef4b57;--food:#ffa41b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink);
  background:#1c9fc5 radial-gradient(120% 80% at 50% 0%,#8fe3f5 0%,#27a9cf 45%,#0b6c90 100%);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit}
#app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;
  background:var(--cream);box-shadow:0 0 50px rgba(0,40,60,.35);overflow-x:hidden;overflow-y:auto}

/* 위쪽: 날짜·날씨·배부름·체력 */
#top{flex:none;padding:9px 12px 8px;background:linear-gradient(#fff3dc,#ffe8c2);border-bottom:2px solid var(--line)}
.r1{display:flex;align-items:center;gap:7px}
#day{font-weight:900;font-size:18px;letter-spacing:-.4px;white-space:nowrap}
#dday{font-size:11.5px;font-weight:900;color:#fff;background:var(--accent2);padding:2px 8px;border-radius:99px;white-space:nowrap}
#dday.hot{background:var(--bad);animation:pulse 1s infinite}
#slot{margin-left:auto;font-size:13px;font-weight:900;display:flex;align-items:center;gap:5px;white-space:nowrap}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:block;box-shadow:inset 0 -1px 0 rgba(0,0,0,.15)}
.dots i.used{background:#e3d0ab;box-shadow:none}
#helpBtn{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:900;color:var(--ink2);cursor:pointer;padding:0}
.r2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink2);font-weight:800;margin:5px 0 6px;white-space:nowrap}
#wxTom.warn{color:var(--bad);animation:pulse 1s infinite}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:900;white-space:nowrap}
.track{flex:1;height:12px;border-radius:99px;background:#f0dfbd;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.1)}
.fill{height:100%;width:0;border-radius:99px;transition:width .45s ease}
#hgFill{background:linear-gradient(90deg,#ffc94d,#ff9a1c)}
#hpFill{background:linear-gradient(90deg,#ff8ea3,#ff4766)}
.bar b{min-width:22px;text-align:right;font-size:12.5px}
.bar.low{color:var(--bad)}
.bar.low .track{animation:pulse .8s infinite}

/* 가운데: 섬 그림 */
#sceneWrap{position:relative;flex:1 1 auto;min-height:200px;background:#2bb5d8;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
#toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);max-width:92%;width:max-content;text-align:center;
  background:rgba(40,25,5,.85);color:#fff;font-size:13.5px;font-weight:800;line-height:1.35;padding:7px 14px;border-radius:16px;
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* 아래: 힌트·가방·행동 버튼 */
#panel{flex:none;padding:8px 10px calc(10px + env(safe-area-inset-bottom));border-top:2px solid var(--line);background:var(--cream)}
#hint{font-size:12.5px;font-weight:800;line-height:1.35;background:var(--paper);border:1.5px dashed #f0c27e;border-radius:12px;
  padding:6px 10px;margin-bottom:7px;min-height:32px;display:flex;align-items:center}
#hint.warn{border:1.5px solid #ff9d9d;background:#fff1f1;color:#b4232f}
.goal{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;margin-bottom:7px;white-space:nowrap}
.goal .track{height:10px}
#raftFill{background:linear-gradient(90deg,#d59552,#8a5523)}
#goalX{color:var(--ink2)}
#inv{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:3px 9px;font-size:13.5px;font-weight:900;
  display:inline-flex;align-items:center;gap:3px;cursor:pointer}
.chip.food{border-color:#ffc56b;background:#fff7e3}
.chip.food::after{content:"먹기";font-size:9.5px;font-weight:900;color:#fff;background:var(--food);border-radius:99px;padding:1px 5px;margin-left:2px}
.chip.zero{opacity:.45}
.chip.zero::after{display:none}
.chip.gold{border-color:#ffd54a;background:#fff6c9}
#acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#acts.wait .act{opacity:.55}
.act{position:relative;border:none;border-radius:13px;background:#fff;box-shadow:0 3px 0 var(--shadow),inset 0 0 0 1.5px var(--line);
  padding:6px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;transition:transform .08s}
.act:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow),inset 0 0 0 1.5px var(--line)}
.act .nm{font-size:13.5px;font-weight:900;letter-spacing:-.4px;white-space:nowrap}
.act .ic{font-size:17px;margin-right:3px}
.act .sb{font-size:10.5px;font-weight:800;color:var(--ink2);white-space:nowrap}
.act.new::before{content:"NEW";position:absolute;top:-6px;right:-2px;background:var(--bad);color:#fff;font-size:9px;font-weight:900;padding:1px 5px;border-radius:99px}
.act.hero{grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px;padding:9px;background:linear-gradient(135deg,#ffb347,#ff6a2b);
  color:#fff;box-shadow:0 3px 0 #d0541c;animation:glow 1.4s infinite}
.act.hero .sb{color:#fff3e0}

/* 팝업 카드 */
#modal{position:fixed;inset:0;background:rgba(20,12,0,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
#modal[hidden]{display:none}
.card{width:100%;max-width:390px;max-height:94vh;max-height:94dvh;overflow:auto;background:var(--paper);border-radius:22px;
  padding:18px 16px 14px;box-shadow:0 18px 50px rgba(0,0,0,.35);text-align:center;animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
.c-face{width:92px;height:auto;display:block;margin:0 auto 6px}
.c-icon{font-size:50px;line-height:1.15;margin-bottom:4px}
.c-title{font-size:20px;font-weight:900;letter-spacing:-.5px;margin-bottom:6px}
.c-text{font-size:14.5px;line-height:1.55;white-space:pre-line;color:#5a4224;margin-bottom:12px}
.c-lines{list-style:none;padding:0;margin:0 0 12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.c-lines li{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13.5px;font-weight:800;line-height:1.4}
.c-lines li.good{border-color:#bfe8cd;background:#f2fff5}
.c-lines li.bad{border-color:#ffc9c9;background:#fff3f3}
.c-btns{display:flex;flex-direction:column;gap:8px}
.btn{border:none;border-radius:14px;padding:12px 14px;font-size:15px;font-weight:900;cursor:pointer;background:#f3e6cc;box-shadow:0 3px 0 #dcc59a}
.btn.pri{background:linear-gradient(135deg,#ffb347,#ff6a2b);color:#fff;box-shadow:0 3px 0 #d0541c}
.btn:active{transform:translateY(2px);box-shadow:none}

/* 만들기 목록 */
.b-list{display:flex;flex-direction:column;gap:7px;margin:4px 0 10px;text-align:left}
.b-row{display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 9px}
.b-row.done{background:#f2fff5;border-color:#bfe8cd}
.b-row.locked{background:#f6efe2;opacity:.8}
.b-ic{font-size:28px;width:36px;text-align:center;flex:none}
.b-main{flex:1;min-width:0}
.b-nm{font-weight:900;font-size:15px}
.b-nm small{font-size:12px;color:var(--ink2);font-weight:900}
.b-ds{font-size:12px;color:#6d5434;line-height:1.35;margin:2px 0 4px;font-weight:700}
.b-cost{display:flex;gap:5px;flex-wrap:wrap}
.cc{font-size:12px;font-weight:900;background:#f5ecd9;border-radius:99px;padding:2px 7px}
.cc.miss{background:#ffe1e1;color:#d12f3c}
.b-go{flex:none;border:none;border-radius:12px;padding:9px 11px;font-weight:900;font-size:13.5px;cursor:pointer;
  background:linear-gradient(135deg,#ffb347,#ff6a2b);color:#fff;box-shadow:0 2px 0 #d0541c}
.b-go:disabled{background:#e9dcc3;color:#a08a66;box-shadow:none;cursor:default}
.b-done,.b-lock{font-size:22px;flex:none;padding:0 4px}
.b-note{font-size:12px;color:var(--ink2);font-weight:800;margin-bottom:10px}

/* 첫 화면·엔딩 */
.t-sub{font-size:12px;font-weight:900;color:var(--accent2);letter-spacing:1px}
.t-title{font-size:30px;font-weight:900;line-height:1.12;letter-spacing:-1px;margin:3px 0 8px;color:#1f6f8b}
.howto{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:9px 12px;text-align:left;font-size:13.5px;font-weight:700;line-height:1.75;margin-bottom:10px}
.et-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.et{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.et span{font-size:22px;line-height:1.2}
.et small{font-size:10.5px;font-weight:800;color:var(--ink2);line-height:1.25}
.et.lock{background:#f3eadb}
.et.lock span{filter:grayscale(1);opacity:.55;font-size:18px}
.endrow{display:flex;justify-content:center;gap:5px;margin-bottom:4px}
.endrow span{width:38px;height:38px;border-radius:11px;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:21px}
.endrow span.lock{background:#efe4cf;font-size:15px;filter:grayscale(1);opacity:.6}
.endcap{font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:12px}
.end-tag{display:inline-block;font-size:12px;font-weight:900;letter-spacing:1px;color:#fff;background:#3b2810;border-radius:99px;padding:3px 11px;margin-bottom:8px}
.end-tag.new{background:linear-gradient(135deg,#ff5fa2,#ffb347)}
.grade{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 10px;font-weight:900;font-size:15px;text-align:left}
.grade b{font-size:32px;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(135deg,#ffcf3f,#ff8a00);flex:none}
.grade b.g-A{background:linear-gradient(135deg,#7fd36b,#2fae66)}
.grade b.g-B{background:linear-gradient(135deg,#6cc7ff,#2a86d6)}
.grade b.g-C{background:linear-gradient(135deg,#c4b2a0,#8f7a66)}
.grade em{font-style:normal;color:var(--accent2)}
.stats{font-size:12.5px;font-weight:800;color:var(--ink2);background:#fff;border-radius:12px;border:1.5px solid var(--line);padding:7px 8px;margin-bottom:10px;line-height:1.6}

@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{50%{opacity:.55}}
@keyframes glow{50%{box-shadow:0 3px 0 #d0541c,0 0 0 5px rgba(255,138,61,.28)}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="r1">
      <span id="day">🏝️ 1일째</span>
      <span id="slot"></span>
      <button id="helpBtn" aria-label="도움말">?</button>
    </div>
    <div class="r2"><span><span id="wxNow"></span> · <span id="wxTom"></span></span><span id="dday">D-29</span></div>
    <div class="bars">
      <div class="bar" id="hgBar"><span>🍖 배부름</span><div class="track"><div class="fill" id="hgFill"></div></div><b id="hgNum">0</b></div>
      <div class="bar" id="hpBar"><span>❤️ 체력</span><div class="track"><div class="fill" id="hpFill"></div></div><b id="hpNum">0</b></div>
    </div>
  </header>
  <div id="sceneWrap"><canvas id="scene"></canvas><div id="toast"></div></div>
  <section id="panel">
    <div id="hint"></div>
    <div class="goal"><span>🛶 뗏목</span><div class="track"><div class="fill" id="raftFill"></div></div><b id="raftNum">0/5</b><span id="goalX"></span></div>
    <div id="inv"></div>
    <div id="acts"></div>
  </section>
</div>
<div id="modal" hidden><div class="card" id="card"></div></div>

const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hasBatchim = w => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return c >= 0 && c <= 11171 && c % 28 > 0; };

const cv = $("scene"), ctx = cv.getContext("2d");
let W = 300, H = 300, DPR = 1;
const G = { cx: 150, cy: 150, rx: 100, ry: 100, u: 30 };
const V = { night: 0, tint: [255, 255, 255, 0], flash: 0, nextBolt: 0, voy: null, signalLit: false, jump: null, nextJump: 0 };

const parts = [], floats = [], tweens = [];

function pos(n) { const p = PL[n]; return { x: G.cx + p.x * G.rx, y: G.cy + p.y * G.ry }; }
function standPos(n) {
  const p = pos(n), u = G.u;
  if (n === "wreck") return { x: p.x - u * 1.25, y: p.y + u * 1.55 };
  if (n === "raft") return { x: p.x - u * 1.55, y: p.y + u * 0.35 };
  if (n === "hill") return { x: p.x - u * 1.1, y: p.y + u * 0.8 };
  if (n === "beach") return { x: p.x - u * 0.95, y: p.y + u * 0.5 };
  return { x: p.x + u * 0.95, y: p.y + u * 0.6 };
}
function resize() {
  const r = $("sceneWrap").getBoundingClientRect();
  W = Math.max(50, r.width); H = Math.max(50, r.height);
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  G.cx = W / 2; G.cy = H * 0.52; G.rx = Math.min(W * 0.39, H * 0.62); G.ry = H * 0.36;
  G.u = clamp(Math.min(W * 0.088, H * 0.085), 20, 44);
  if (!komi.walk) { const p = standPos(komi.spot); komi.x = p.x; komi.y = p.y; }
}

// 이모지는 한 번만 그려 두고 크기만 바꿔서 씀 (빠르게)
const EC = {};
function emojiCanvas(ch) {
  if (EC[ch]) return EC[ch];
  const s = 160, c = document.createElement("canvas"); c.width = c.height = s;
  const x = c.getContext("2d");
  x.font = `${s * 0.78}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  x.textAlign = "center"; x.textBaseline = "middle"; x.fillStyle = "#000";
  x.fillText(ch, s / 2, s / 2 + s * 0.04);
  return (EC[ch] = c);
}
function emo(ch, x, y, size, rot, alpha) {
  const c = emojiCanvas(ch), d = size * 1.28;
  ctx.save();
  if (alpha != null) ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.translate(x, y); if (rot) ctx.rotate(rot);
  ctx.drawImage(c, -d / 2, -d / 2, d, d);
  ctx.restore();
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function ell(x, y, a, b) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, a), Math.max(0.1, b), 0, 0, Math.PI * 2); }
function tween(obj, key, to, ms) { return new Promise(res => tweens.push({ obj, key, from: obj[key], to, t0: performance.now(), ms, res })); }
function setFace(f, ms) { komi.face = f; komi.faceUntil = performance.now() + (ms || 1200); }
function curFace() {
  if (performance.now() < komi.faceUntil) return komi.face;
  return S.hp < 30 || S.hunger < 25 ? "caught" : "smirk";
}
function burst(x, y, e, n) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - 0.5) * 150, vy: -170 - Math.random() * 100, e, t0: performance.now(), life: 850 + Math.random() * 250 });
}
function floatText(x, y, text, color) { floats.push({ x, y, text, color: color || "#3b2810", t0: performance.now() }); }
function walkTo(n) {
  const to = standPos(n), d = Math.hypot(to.x - komi.x, to.y - komi.y);
  if (d < 3) { komi.spot = n; return Promise.resolve(); }
  komi.flip = to.x < komi.x - 1;
  const ms = clamp(d * 3.4, 380, 1100);
  return new Promise(res => { komi.walk = { fx: komi.x, fy: komi.y, n, t0: performance.now(), ms, res }; });
}
async function doing(icon, ms) { komi.act = icon; await sleep(ms); komi.act = null; }

// ===== 섬 그리기 =====
function islandF(t, ph) { return 1 + 0.06 * Math.sin(3 * t + 0.5 + ph) + 0.04 * Math.sin(5 * t + 1.3 + ph * 0.7) + 0.03 * Math.cos(7 * t + ph * 0.3); }
function blob(scale, ph) {
  ctx.beginPath();
  for (let i = 0; i <= 80; i++) {
    const t = i / 80 * Math.PI * 2, f = islandF(t, ph) * scale;
    const x = G.cx + Math.cos(t) * G.rx * f, y = G.cy + Math.sin(t) * G.ry * f;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function drawSea(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#46cbe9"); g.addColorStop(1, "#1795c4");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = 2; ctx.lineCap = "round";
  ctx.beginPath();
  const rows = Math.ceil(H / 32);
  for (let j = 0; j < rows; j++) {
    const y = j * 32 + 14, dir = j % 2 ? 1 : -1;
    for (let k = 0; k < 5; k++) {
      let x = (hash(j * 7 + k) * (W + 60) + t * 13 * dir) % (W + 60); if (x < 0) x += W + 60; x -= 30;
      ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 7, y - 5, x + 14, y); ctx.quadraticCurveTo(x + 21, y + 5, x + 28, y);
    }
  }
  ctx.stroke();
}
function drawIsland(t) {
  ctx.fillStyle = "rgba(150,235,245,.45)"; blob(1.2, 0); ctx.fill();
  ctx.fillStyle = "rgba(195,246,248,.6)"; blob(1.09, 0); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 3; blob(1.025 + 0.012 * Math.sin(t * 1.7), 0); ctx.stroke();
  ctx.fillStyle = "#f7db97"; blob(1, 0); ctx.fill();
  ctx.fillStyle = "#f0cd80"; blob(0.9, 0.4); ctx.fill();
  ctx.fillStyle = "#6cc35b"; blob(0.8, 0.9); ctx.fill();
  ctx.strokeStyle = "rgba(50,120,45,.35)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = "#5fb650"; blob(0.56, 2.1); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.07)"; blob(0.3, 3.3); ctx.fill();
}
// 해변을 걸어다니는 꽃게 (장식)
function drawCrab(t) {
  const s = Math.sin(t * 0.35), th = Math.PI / 2 + 0.15 + s * 0.28, f = islandF(th, 0) * 0.94;
  const x = G.cx + Math.cos(th) * G.rx * f, y = G.cy + Math.sin(th) * G.ry * f;
  emo("🦀", x, y, G.u * 0.5, Math.sin(t * 9) * 0.12);
}
// 가끔 바다에서 물고기가 폴짝
function drawJumper(now) {
  if (!V.jump && now > V.nextJump) {
    for (let k = 0; k < 6; k++) {
      const x = 20 + Math.random() * (W - 40), y = 20 + Math.random() * (H - 40);
      const nx = (x - G.cx) / G.rx, ny = (y - G.cy) / G.ry;
      if (nx * nx + ny * ny > 1.6) { V.jump = { x, y, t0: now, dir: chance(0.5) ? 1 : -1 }; break; }
    }
    V.nextJump = now + 3500 + Math.random() * 4000;
  }
  const j = V.jump; if (!j) return;
  const p = (now - j.t0) / 900;
  if (p >= 1.3) { V.jump = null; return; }
  ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 1.5;
  if (p < 0.3) { ell(j.x, j.y, 6 + p * 30, 3 + p * 12); ctx.stroke(); }
  if (p > 0.9) { const q = p - 0.9; ell(j.x + j.dir * 34, j.y, 6 + q * 30, 3 + q * 12); ctx.stroke(); }
  if (p < 1) emo("🐟", j.x + j.dir * 34 * p, j.y - Math.sin(p * Math.PI) * 26, G.u * 0.5, j.dir * (p - 0.5) * 2.2);
}

// ===== 장소 그리기 =====
const sway = () => (S.weather === "storm" ? 0.2 : S.weather === "rain" ? 0.08 : 0.04);
function drawForest(p, t) {
  const u = G.u, s = sway();
  emo("🌲", p.x + u * 0.05, p.y - u * 0.42, u * 1.4, Math.sin(t * 1.1 + 1) * s);
  emo("🌲", p.x - u * 0.6, p.y + u * 0.02, u * 1.2, Math.sin(t * 1.3) * s);
  emo("🌳", p.x + u * 0.62, p.y + u * 0.08, u * 1.15, Math.sin(t * 1.2 + 2) * s);
}
function drawJungle(p, t) {
  const u = G.u, s = sway();
  emo("🌴", p.x - u * 0.38, p.y - u * 0.18, u * 1.4, Math.sin(t * 1.4) * s);
  emo("🌴", p.x + u * 0.48, p.y + u * 0.02, u * 1.15, Math.sin(t * 1.2 + 1.5) * s);
  emo("🌿", p.x + u * 0.05, p.y + u * 0.42, u * 0.7);
}
function drawCamp(p, t) {
  const u = G.u;
  ctx.fillStyle = "rgba(190,140,80,.33)"; ell(p.x, p.y + u * 0.3, u * 1.25, u * 0.6); ctx.fill();
  if (S.built.hut) emo("🛖", p.x - u * 0.85, p.y - u * 0.3, u * 1.5);
  emo("🪵", p.x - u * 0.45, p.y + u * 0.6, u * 0.55);
  if (S.built.fire) {
    const wet = S.weather !== "clear" && !S.built.hut;
    emo(wet ? "💨" : "🔥", p.x + u * 0.12, p.y + u * 0.12, u * (wet ? 0.7 : 0.85 + 0.07 * Math.sin(t * 13) + 0.04 * Math.sin(t * 21)));
  } else {
    ctx.fillStyle = "#a7a39b";
    for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; ell(p.x + u * 0.12 + Math.cos(a) * u * 0.32, p.y + u * 0.3 + Math.sin(a) * u * 0.16, u * 0.1, u * 0.07); ctx.fill(); }
  }
}
function drawBeach(p) {
  const u = G.u;
  emo("🐚", p.x - u * 0.35, p.y + u * 0.3, u * 0.5, -0.3);
  if (S.built.rod) emo("🎣", p.x + u * 0.25, p.y - u * 0.05, u * 0.8);
  else emo("🐚", p.x + u * 0.25, p.y + u * 0.05, u * 0.42, 0.4);
}
function drawRaftAt(x, y, n, sail, s) {
  const w = s * 1.9, lh = s * 0.3, top = y - lh * 2.5;
  if (n <= 0) {
    ctx.setLineDash([5, 4]); ctx.strokeStyle = "rgba(110,70,25,.6)"; ctx.lineWidth = 2;
    rr(x - w / 2, top, w, lh * 5, 6); ctx.stroke(); ctx.setLineDash([]);
    return;
  }
  ctx.fillStyle = "rgba(0,0,0,.12)"; ell(x, y + lh * 0.2, w * 0.55, lh * 0.8); ctx.fill();
  for (let i = 0; i < n; i++) {
    const ly = top + i * lh;
    ctx.fillStyle = i % 2 ? "#a8692f" : "#bd7b3c"; rr(x - w / 2, ly, w, lh - 1, lh / 2); ctx.fill();
    ctx.fillStyle = "#e0b27a"; ell(x - w / 2 + lh * 0.45, ly + lh / 2 - 0.5, lh * 0.25, lh * 0.33); ctx.fill();
  }
  if (n >= 2) {
    ctx.strokeStyle = "#4f8a35"; ctx.lineWidth = 2.5; ctx.beginPath();
    for (const fx of [-0.28, 0.28]) { ctx.moveTo(x + w * fx, top); ctx.lineTo(x + w * fx, top + n * lh - 1); }
    ctx.stroke();
  }
  if (sail) {
    ctx.strokeStyle = "#6b4219"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, top + lh); ctx.lineTo(x, top - s * 1.5); ctx.stroke();
    ctx.fillStyle = "#fffdf5"; ctx.strokeStyle = "rgba(0,0,0,.15)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + 2, top - s * 1.45); ctx.quadraticCurveTo(x + s * 1.1, top - s * 0.7, x + 2, top - s * 0.05); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
function drawHill(p, t) {
  const u = G.u;
  emo("⛰️", p.x, p.y, u * 1.9);
  if (S.built.signal || V.signalLit) {
    emo("🪵", p.x + u * 0.95, p.y + u * 0.5, u * 0.6);
    if (V.signalLit) {
      emo("🔥", p.x + u * 0.95, p.y + u * 0.05, u * (1.2 + 0.1 * Math.sin(t * 12)));
      for (let i = 0; i < 4; i++) {
        const q = (t * 0.6 + i / 4) % 1;
        ctx.fillStyle = `rgba(120,120,130,${0.5 * (1 - q)})`; ell(p.x + u * (0.95 + q * 0.6), p.y - u * (0.5 + q * 2.2), u * (0.25 + q * 0.4), u * (0.2 + q * 0.3)); ctx.fill();
      }
    } else emo("🆘", p.x + u * 0.95, p.y - u * 0.05, u * 0.62);
  }
}
function drawCave(p) {
  const u = G.u * 1.05, x = p.x, y = p.y;

async function doAct(id, target) {
  if (busy || !S || S.over || !$("modal").hidden) return;
  if (id === "build") return openBuild();
  if (id === "sail") return openSail();
  const a = ACT[id];
  if (!a || (a.avail && !a.avail())) return;
  const c = costOf(id);
  if (c > 0 && S.hp - c <= 0 && !(await lowHpOk())) return;
  busy = true; render();
  try {
    const spot = id === "explore" ? exploreTarget(target) : a.spot;
    if (S.newActs[id]) delete S.newActs[id];
    await walkTo(spot);
    if (id === "fish") komi.flip = false;
    await doing(a.icon, 750);
    S.hp -= c; S.hunger -= a.hg != null ? a.hg : 7;

    await afterWork();
  } finally { busy = false; render(); }
}

  if (S.treasure) chips.push(`<button class="chip gold" data-k="gold">💰 보물</button>`);
  $("inv").innerHTML = chips.join("");
  const list = (S.raft >= 5 ? ["sail"] : []).concat(ORDER.filter(id => !ACT[id].avail || ACT[id].avail()));
  $("acts").innerHTML = list.map(id => {
    const a = ACT[id], c = a.cost ? costOf(id) : 0;
    return `<button class="act${id === "sail" ? " hero" : ""}${S.newActs[id] ? " new" : ""}" data-a="${id}"><span class="nm"><span class="ic">${a.icon}</span>${a.name}</span><span class="sb">${a.sub()}${c ? ` · ❤️-${c}` : ""}</span></button>`;
  }).join("");
  $("acts").classList.toggle("wait", busy || S.over);
}
function eat(k) {
  if (!S || S.over || busy || !$("modal").hidden) return;
  if (S.inv[k] <= 0) return toast(`${ICON[k]} ${iga(FOOD[k].name)} 없어요`);
  if (S.hunger >= 100) return toast("배불러요! 더는 못 먹어요 🍖");
  S.inv[k]--;
  const v = foodVal(k);
  S.hunger = Math.min(100, S.hunger + v);
  setFace("laugh", 1100);
  floatText(komi.x, komi.y - G.u * 2.5, `🍖+${v}`, "#d97a00");
  toast(`${ICON[k]} ${foodName(k)} 냠냠! 배부름 +${v}`);
  save(); render();
}

// ===== 버튼 연결 · 시작 =====
$("acts").addEventListener("click", e => { const b = e.target.closest(".act"); if (b) doAct(b.dataset.a); });
$("inv").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const k = b.dataset.k;
  if (FOOD[k]) return eat(k);
  if (MAT[k]) return toast(`${ICON[k]} ${MAT[k].name}: ${MAT[k].use}`, 2600);
  if (k === "map") return toast("🗺️ 보물지도 조각: 3개를 모으면 보물 위치가 나타나요", 2600);
  if (k === "gold") return toast("💰 보물상자! 가지고 탈출하면 특별한 엔딩이...", 2600);
});
$("helpBtn").addEventListener("click", showHelp);
window.addEventListener("resize", resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($("sceneWrap"));
resize(); resetVisual(); render();
requestAnimationFrame(frame);

showTitle();
// 세카이 사이트 안에서 처음 누르면 전체 화면 요청 (꼬미 키우기와 같은 방식)
addEventListener("pointerdown", function askFull() {
  removeEventListener("pointerdown", askFull, true);
  try { if (window.parent !== window) window.parent.postMessage({ type: "komi-fullscreen" }, location.origin); } catch (e) {}
}, true);

})();
</script>
